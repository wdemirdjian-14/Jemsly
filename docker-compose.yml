# Par défaut : l'app écoute seulement en local (127.0.0.1:${APP_PORT}) et un nginx
# déjà présent sur le VPS la sert en HTTPS (voir deploy/nginx.conf.example).
# Sans serveur web existant :  docker compose --profile caddy up -d   (HTTPS auto via Caddy)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: "1"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${APP_PORT:-8765}:8000"

  caddy:
    image: caddy:2.10
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-wazzzxpense.walautao.fr}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
