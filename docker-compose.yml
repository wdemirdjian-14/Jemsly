# Déploiement : app + Caddy (HTTPS automatique Let's Encrypt).
# Si votre VPS a déjà un reverse proxy (nginx…), supprimez le service caddy et
# exposez l'app avec   ports: ["127.0.0.1:8000:8000"]   (voir README).
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: "1"
    volumes:
      - ./data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-wazzzxpense.walautao.fr}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
