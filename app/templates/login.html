<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4bff">
  <meta name="robots" content="noindex, nofollow">
  <title>Connexion · {{ APP_NAME }}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css?v=1">
</head>
<body style="padding-bottom:0">
  <div class="login">
    <div style="text-align:center"><img src="/static/icon.svg" width="72" height="72" alt=""></div>
    <h1 style="text-align:center">{{ APP_NAME }}</h1>
    <div class="card">
      {% if not configured %}
      <p>⚠️ Aucun compte n'est configuré. Définissez <code>APP_USERNAME</code> et <code>APP_PASSWORD</code> dans le fichier <code>.env</code> du serveur puis redémarrez.</p>
      {% endif %}
      {% if error %}<div class="alert bad">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <label for="un">Identifiant</label>
        <input id="un" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required>
        <label for="pw">Mot de passe</label>
        <input id="pw" type="password" name="password" autocomplete="current-password" required>
        <button class="btn block" type="submit">Se connecter</button>
      </form>
    </div>
  </div>
</body>
</html>
